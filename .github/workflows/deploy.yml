# Build the site and publish it to GitHub Pages.
#
# The build is gated: if check.js finds a broken link, a missing <h1>, an image without alt
# text or leftover placeholder text, the deploy fails and the previous version stays live.
# A portfolio about verifying your own work should not publish unverified output.
#
# SITE_URL controls canonical URLs, the sitemap, the share card, and the base path for
# internal links. Set it in: Settings > Secrets and variables > Actions > Variables.
#   User site  (repo named <username>.github.io) -> https://<username>.github.io
#   Project site (any other repo name)           -> https://<username>.github.io/<repo>
#   Custom domain                                -> https://your-domain.com

name: Deploy site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # No npm install: this project has no dependencies.

      - name: Unit tests
        run: node --test test.js

      - name: Generate CV and share image
        run: |
          node tools/make-cv.js
          node tools/make-og.js

      - name: Build
        env:
          SITE_URL: ${{ vars.SITE_URL }}
        run: node build.js

      - name: Verify build
        env:
          SITE_URL: ${{ vars.SITE_URL }}
        run: node check.js

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
